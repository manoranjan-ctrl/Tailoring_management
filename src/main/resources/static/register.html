<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration - TailorCraft</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="main-content">
        <div class="auth-container">
            <div class="auth-header">
                <div class="brand-monogram" style="margin: 0 auto 0.75rem auto;">&#9986;</div>
                <h2>Create Customer Profile</h2>
                <p style="font-size:0.88rem; color:var(--text-muted);">Register to save custom measurements and place bespoke tailoring orders</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" class="form-input" placeholder="e.g. Ramesh Kumar" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="ramesh@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-input" placeholder="9876543210" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Minimum 6 characters" minlength="6" required>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="margin-top:1rem;">Register Account</button>
            </form>

            <div style="text-align:center; margin-top:1.25rem; font-size:0.88rem;">
                <span style="color:var(--text-muted);">Already have an account?</span>
                <a href="login.html" style="font-weight:600; margin-left:0.25rem;">Sign In</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">TailorCraft &bull; Online Tailoring Management System</div>
            <div class="footer-note">College Project &bull; Spring Boot + MongoDB</div>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.disabled = true;
            submitBtn.innerText = 'Creating Profile...';

            try {
                const user = await apiCall('/users/register', 'POST', { name, email, phone, password });
                setCurrentUser(user);
                showToast('Registration complete! Welcome to TailorCraft.', 'success');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 600);
            } catch (err) {
                showToast(err.message || 'Registration failed.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Register Account';
            }
        });
    </script>
</body>
</html>
