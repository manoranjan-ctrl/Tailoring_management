<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TailorCraft</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="main-content">
        <div class="auth-container">
            <div class="auth-header">
                <div class="brand-monogram" style="margin: 0 auto 0.75rem auto;">&#9986;</div>
                <h2>Account Sign In</h2>
                <p style="font-size:0.88rem; color:var(--text-muted);">Access your tailoring measurements and orders</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="margin-top:1rem;">Sign In</button>
            </form>

            <div style="text-align:center; margin-top:1.25rem; font-size:0.88rem;">
                <span style="color:var(--text-muted);">New customer?</span>
                <a href="register.html" style="font-weight:600; margin-left:0.25rem;">Create an Account</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">TailorCraft &bull; Online Tailoring Management System</div>
            <div class="footer-note">College Project &bull; Spring Boot + MongoDB</div>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.disabled = true;
            submitBtn.innerText = 'Authenticating...';

            try {
                const user = await apiCall('/users/login', 'POST', { email, password });
                setCurrentUser(user);
                showToast(`Welcome back, ${user.name}`, 'success');
                
                setTimeout(() => {
                    if (user.role === 'MASTER' || user.role === 'ADMIN') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 500);
            } catch (err) {
                showToast(err.message || 'Login failed. Check your email or password.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Sign In';
            }
        });
    </script>
</body>
</html>
